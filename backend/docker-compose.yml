version: '3.8'

services:
  notes-app:
    build: .
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - ./notes.db:/root/notes.db
    environment:
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
