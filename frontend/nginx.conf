# nginx config for the compiled Flutter web bundle.
#
# Flutter's build output is not a set of pages: it is one application that owns
# its own routes, so the server has two jobs — serve hashed assets
# immutably, and hand every unknown path back to index.html so that go_router
# can resolve it client-side.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # main.dart.js is a couple of megabytes and CanvasKit adds wasm on top.
    # Without compression a cold page load costs several times what it should.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/javascript;

    # Flutter's own build already emits .br and .gz siblings next to each
    # large file; serve those instead of compressing on every request.
    gzip_static on;

    # Filenames carry a content hash, so a byte that is already in a browser's
    # cache can never go stale. One year is safe precisely because of the hash.
    #
    # ^~ is load-bearing: nginx tries regex locations before plain prefix ones,
    # so without it the no-cache rule below matches these very files on their
    # .json and .wasm extension, and the hashed assets get revalidated on every
    # single load — the opposite of what this block is for.
    location ^~ /assets/ {
        # Only add_header, no `expires 1y`: expires emits a second Cache-Control
        # of its own, and a response carrying the header twice is legal but
        # leaves every reader guessing which one won.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The loader, the service worker and the manifest are not hashed, so they
    # must be revalidated or a redeploy leaves stale bootstrap code running.
    location ~* \.(?:js|wasm|json|html|manifest\.json)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything else is a client-side route. /notes/42 has no file behind it,
    # and answering 404 would strand the user on a dead page with no way back,
    # so the app shell is served instead and the router takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html specifically must never be cached: it names the hashed
    # bootstrap and asset files for this build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}