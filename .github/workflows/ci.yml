name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      # GitHub only reads workflows from the repository root, so this file moved
      # up when the backend joined the monorepo. Every command below therefore
      # has to name the module directory, or it runs where there is no go.mod
      # and no Taskfile.
      run:
        working-directory: backend

    permissions:
      contents: read

    env:
      # Consumed by the integration test, which is skipped when unset.
      # The database itself is started by `task test:integration` through
      # docker compose; declaring it here as a `services:` container as well
      # would collide over host port 5432.
      NOTES_TEST_DB_HOST: localhost
      NOTES_TEST_DB_PORT: 5432
      NOTES_TEST_DB_USER: postgres
      NOTES_TEST_DB_PASS: password
      NOTES_TEST_DB_NAME: notes_db

      # The HTTP and gRPC middleware tests build the authenticator directly, so
      # they do not read API_KEYS. The integration test does not either. This is
      # set so that any test that does go through config.Load() starts cleanly.
      API_KEYS: ci-test-key
      RATE_LIMIT_RPS: "1000"
      RATE_LIMIT_BURST: "2000"
      TRACE_EXPORTER: none

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Must satisfy the "go" directive in go.mod. The path is relative to
          # the repository root, not to the defaults.run working directory.
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check gofmt
        # vendor/ is excluded: it holds third-party code at its upstream
        # formatting, and reformatting it would make `go mod vendor` produce a
        # dirty tree on the next refresh.
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' | grep -v '^vendor/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Install Task
        run: sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          install-mode: goinstall
          version: latest
          # `defaults.run` does not reach a `uses:` step, so this one has to
          # name the directory itself. Left unset, the action runs in the
          # repository root, finds no .golangci.yml and no Go files there, and
          # reports on nothing.
          working-directory: backend

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Separate from `task ci` because it needs the database-free module graph
      # only, and a reachable vulnerability should fail the build on its own
      # signal rather than as part of a long pipeline. GO-2026-6443 is the
      # reason this step exists: it was reachable through grpc.Server.Serve.
      - name: Scan for reachable vulnerabilities
        run: govulncheck ./...

      - name: Run CI Pipeline
        run: task ci
